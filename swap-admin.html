<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>لوحة طلبات التبديل — الأدمن</title>
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{--primary:#1f6b4a;--primary-strong:#17543a;--primary-soft:#e5f1ec;--ink:#1c2420;--ink-2:#5c6b63;--surface:#fff;
  --surface-sunk:#f3f6f4;--rule:#dfe6e1;--radius:12px;--signal:#b3433b;--signal-soft:#fbe9e7;--shadow:0 6px 18px rgba(20,40,30,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-sunk);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14.5px}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.gate .card{max-width:360px;width:100%;text-align:center}
.gate .lock{font-size:30px;color:var(--primary);margin-bottom:8px}
input[type=password],input[type=text]{width:100%;height:46px;border:1px solid var(--rule);border-radius:999px;
  padding:0 16px;font-family:inherit;font-size:14px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border:0;
  border-radius:999px;background:var(--primary);color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;
  cursor:pointer;width:100%;margin-top:12px}
.btn:disabled{background:#c9ccd0;cursor:not-allowed}
.err{color:var(--signal);font-size:12.5px;margin-top:10px;min-height:1em}
h1{font-size:1.2em;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:13px;margin-bottom:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{flex:0 1 auto;border:1px solid var(--rule);background:var(--surface);padding:9px 14px;border-radius:999px;
  font-family:inherit;font-weight:700;font-size:12.8px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.toolbar button{flex:0 1 auto;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:9px 14px;
  border-radius:999px;font-family:inherit;font-weight:700;font-size:12.8px;cursor:pointer;white-space:nowrap}
#refreshBtn i{transition:transform .2s}
#refreshBtn.spin i{animation:refreshSpin .7s linear infinite}
@keyframes refreshSpin{to{transform:rotate(360deg)}}
.last-refresh{font-size:11.5px;color:var(--ink-2);margin:-10px 0 12px;text-align:end}
.req{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.req .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.req .who{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req .meta{color:var(--ink-2);font-size:12.5px;margin-top:3px}

/* نوع الطلب — لونٌ مختلف لكلٍّ من «شيل» و«تبديل» لتمييزٍ فوريّ بنظرة. */
.kind-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;flex:none}
.kind-badge.kind-shel{background:var(--primary-soft);color:var(--primary-strong)}
.kind-badge.kind-swap{background:#e3edf7;color:#2a5a8c}

/* نوع المناوبة وتاريخها — شارات واضحة بدل سطر نصّي متواصل. */
.shift-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.shift-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-sunk);
  border:1px solid var(--rule);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--ink)}
.shift-chip i{color:var(--ink-2);font-size:11px}
.shift-chip.date{font-variant-numeric:tabular-nums}
.shift-chip.back{background:#e3edf7;border-color:#c7d9ec;color:#1f466e}
.shift-chip.back i{color:#2a5a8c}

/* تنبيهٌ بارزٌ حين يفشل تنفيذ التبديل على الجدول — لا يجوز أن يُفوَّت. */
.sched-alert{display:flex;gap:10px;align-items:flex-start;background:var(--signal-soft);
  border:2px solid var(--signal);border-radius:var(--radius);padding:11px 13px;margin-top:10px;
  font-size:12.8px;color:var(--signal)}
.sched-alert i{font-size:16px;margin-top:1px;flex:none}
.sched-alert b{display:block;margin-bottom:3px;color:var(--signal)}
.sched-alert span{color:var(--ink);display:block}
.retry-btn{margin-top:8px;height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--signal);
  background:#fff;color:var(--signal);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.retry-btn:hover{background:var(--signal);color:#fff}
.retry-btn:disabled{opacity:.6;cursor:not-allowed}
.notes.sched-ok{display:flex;align-items:center;gap:7px;color:var(--primary-strong)}
.notes.sched-ok i{color:var(--primary)}
.req .notes{font-size:12.5px;margin-top:8px;background:var(--surface-sunk);border-radius:8px;padding:8px 10px}
.stat-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-2)}
.stat-row b{color:var(--ink);font-variant-numeric:tabular-nums}
.gender-box{margin-top:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12.3px}
.gender-box .g-head{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.gender-box .g-row{display:flex;gap:14px;color:var(--ink-2)}
.gender-box.ok{border-color:#bfe3cc;background:#f3fbf5}
.gender-box.warn{border-color:#f0cfcb;background:var(--signal-soft)}
.gender-box.warn .g-head{color:var(--signal)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.urgent{background:var(--signal-soft);color:var(--signal)}
.badge.status{background:#fdf1d6;color:#8a6a1f}
.badge.approved{background:#dcf3e3;color:#1f7a42}
.badge.rejected{background:var(--signal-soft);color:var(--signal)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{height:36px;padding:0 16px;border-radius:999px;border:0;font-weight:700;font-size:12.8px;cursor:pointer}
.actions .ok{background:var(--primary);color:#fff}
.actions .no{background:var(--signal);color:#fff}
.actions input{flex:1;height:36px;border-radius:999px;border:1px solid var(--rule);padding:0 12px;font-size:12.5px}
.empty{color:var(--ink-2);text-align:center;padding:30px 0}

.doc-name-link{cursor:pointer;border-bottom:1px dashed var(--ink-2)}
.doc-name-link:hover{color:var(--primary);border-color:var(--primary)}

/* ------------------------------------------------- نافذة رزنامة الطبيب */
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,25,.55);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:999}
.modal-overlay[hidden]{display:none}
.modal-box{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);max-width:480px;
  width:100%;max-height:92vh;overflow-y:auto;padding:20px;position:relative}
.modal-close{position:absolute;top:10px;left:12px;border:0;background:transparent;font-size:20px;line-height:1;
  color:var(--ink-2);cursor:pointer}
.modal-close:hover{color:var(--signal)}
.modal-head{margin-bottom:14px;padding-inline-end:26px}
.modal-name{font-weight:700;font-size:16px;margin-bottom:8px}
.modal-phones{display:flex;flex-direction:column;gap:6px}
.modal-nophone{font-size:12.5px;color:var(--ink-2)}
.mp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;
  background:var(--surface-sunk);border-radius:8px;padding:6px 10px}
.mp-row .mp-num{font-weight:700;color:var(--ink);letter-spacing:.3px;font-variant-numeric:tabular-nums;direction:ltr}
.mp-pbtns{display:flex;gap:5px;flex:none}
.mp-pbtn{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);border-radius:7px;
  width:28px;height:26px;display:grid;place-items:center;cursor:pointer;font-size:11.5px;text-decoration:none}
.mp-pbtn:hover{border-color:var(--primary);color:var(--primary)}
.mp-pbtn.wa:hover{border-color:#25D366;color:#25D366}

.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 11px}
.cal-title{font-weight:700;font-size:14px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--rule);background:var(--surface-sunk);
  color:var(--ink);cursor:pointer}
.cal-nav button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.cal-nav button:disabled{opacity:.35;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-2);padding-bottom:3px}
.cal .day{position:relative;min-height:56px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);
  padding:5px 4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .day.pad{border:0;background:transparent;min-height:0}
.cal .day .dn{font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal .day .tag{font-size:9px;line-height:1.3;font-weight:700;padding:2px 4px;border-radius:5px;
  background:var(--primary-soft);color:var(--primary-strong);align-self:flex-start}
.cal .day.duty{border-color:var(--primary);background:var(--primary-soft)}
.cal .day.hol .tag{background:var(--signal-soft);color:var(--signal)}
.empty-cal{grid-column:1/-1;padding:26px 14px;text-align:center;color:var(--ink-2);font-size:13px;
  background:var(--surface-sunk);border-radius:var(--radius)}

@media (max-width: 480px) {
  /* أزرارٌ بعرضٍ متساوٍ بدل عرضٍ متفاوتٍ يُجبر بعضها على الالتفاف سطرين
     فيبدو أطول من إخوته بلا سبب. */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tabs button{flex:none;width:100%}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .toolbar button{flex:none;width:100%}
  .wrap{padding:18px 12px 48px}
  .req .top{flex-direction:column}
  .stat-row{gap:10px}
  .cal .day{min-height:46px;padding:4px 3px}
  .cal .day .tag{font-size:8px;padding:1px 3px}
  .modal-box{padding:16px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <i class="fas fa-lock lock"></i>
    <h2>لوحة طلبات التبديل</h2>
    <p class="sub">أوّل دخولٍ يُنشئ كلمةَ السرّ (٤ أحرفٍ على الأقل)، وما بعده دخولٌ بها. تُفحَص على الخادم نفسِه — لا سترٌ محليّ هنا.</p>
    <form id="gateForm" autocomplete="off">
      <input id="gateInput" type="password" inputmode="numeric" autocomplete="off" aria-label="كلمة السرّ">
      <button class="btn" id="gateBtn" type="submit"><i class="fas fa-right-to-bracket"></i> دخول</button>
    </form>
    <div class="err" id="gateErr" role="alert"></div>
  </div>
</div>

<div id="page" hidden class="wrap">
  <h1>لوحة طلبات التبديل</h1>
  <div class="sub">موافقة/رفض — الاعتماد ينفّذ التبديل تلقائياً على الجدول.</div>
  <div class="tabs" id="tabs">
    <button type="button" data-f="pending" class="on">بانتظار القرار</button>
    <button type="button" data-f="all">الكل</button>
    <button type="button" data-f="shel">شيل فقط</button>
    <button type="button" data-f="swap">تبديل فقط</button>
    <button type="button" data-f="failed">بحاجة لإعادة محاولة</button>
  </div>
  <div class="toolbar">
    <button type="button" id="sortBtn"><i class="fas fa-arrow-down-wide-short"></i> الأحدث أولاً</button>
    <button type="button" id="refreshBtn"><i class="fas fa-rotate"></i> تحديث</button>
    <button type="button" id="exportBtn"><i class="fas fa-file-excel"></i> تحميل السجل Excel</button>
  </div>
  <div class="last-refresh" id="lastRefresh"></div>
  <div id="list"><p class="empty">جارٍ التحميل...</p></div>
</div>

<div class="modal-overlay" id="docModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="docModalName">
    <button type="button" class="modal-close" id="docModalClose" aria-label="إغلاق">&times;</button>
    <div class="modal-head">
      <div class="modal-name" id="docModalName"></div>
      <div class="modal-phones" id="docModalPhones"></div>
    </div>
    <div class="cal-top">
      <div class="cal-title" id="docCalTitle">—</div>
      <div class="cal-nav">
        <button type="button" id="docCalPrev" aria-label="الشهر السابق"><i class="fas fa-chevron-right"></i></button>
        <button type="button" id="docCalNext" aria-label="الشهر التالي"><i class="fas fa-chevron-left"></i></button>
      </div>
    </div>
    <div class="cal" id="docCalGrid"></div>
  </div>
</div>

<script src="js/core/storage.js?v=__BUILD_ID__" defer></script>

<script src="js/core/dates.js?v=__BUILD_ID__" defer></script>

<script src="js/data/gviz-client.js?v=__BUILD_ID__" defer></script>

<script src="js/domain/oncall-schedule.js?v=__BUILD_ID__" defer></script>
<script src="js/domain/oncall-adjustments.js?v=__BUILD_ID__" defer></script>
<script src="js/domain/doctor-stats.js?v=__BUILD_ID__" defer></script>
<script>
(function () {
  'use strict';
  // الانتظار حتى اكتمال التحليل كي تُحمَّل كل سكربتات js/* بـ`defer` (أسرع —
  // تُجلب بالتوازي بدل تسلسلٍ واحداً تلو الآخر) بثقة أنها نفّذت قبل هذا.
  document.addEventListener('DOMContentLoaded', function () {
  const AUH = window.AUH;
  const { escapeHtml, normAr, splitNames } = AUH.text;
  const el = id => document.getElementById(id);

  let passcode = null; // في الذاكرة فقط — لا يُحفظ، يُطلب من جديد عند إعادة التحميل
  let requests = [];
  let filter = 'pending';
  let sortDesc = true; // الأحدث أولاً افتراضياً

  /** قواعدُ توازن ذكور وإناث لكل فئة — معاينةٌ فقط، لا تمنع الاعتماد. */
  const BALANCE_RULES = [
    { cats: ['عناية قلبية', 'عناية مركز', 'عناية داخلية', 'سابع', 'رابع', 'إسعاف مركز', 'اسعاف مركز'], minM: 2, minF: 2 },
    { cats: ['إسعاف داخلي نهاري', 'اسعاف داخلي نهاري', 'إسعاف داخلي ليلي', 'اسعاف داخلي ليلي'], minM: 5, minF: 0 }
  ];
  function ruleFor(cat) {
    const n = normAr(cat || '');
    return BALANCE_RULES.find(r => r.cats.some(c => normAr(c) === n)) || null;
  }

  // سياقُ الجدول والإحصائيات — يُحمَّل مرّةً بعد نجاح كلمة السرّ، بمعزلٍ عن
  // قائمة الطلبات (فشلُه لا يمنع رؤية الطلبات، فقط يُخفي المعاينة الإضافية).
  const CTX = { ready: false, dataset: null, doctorStats: [] };

  function loadScheduleContext() {
    // هذه اللوحة تحتاج هذه المصادر الستّة فقط لحساب الإحصائيات ومعاينة
    // التوازن — لا الـ١٤ مصدراً كاملةً التي يحتاجها index.html.
    return AUH.data.repository.fetchAll({
      only: ['residents', 'oncall', 'evaluation', 'oncallAdjustments', 'holidays', 'oncallRules']
    })
      .then(fetched => {
        const ds = AUH.data.repository.parseAll(fetched.tables);
        const resolved = AUH.domain.adjustments.resolveAdjustments({
          residents: ds.residents, bonuses: ds.adjustments.bonuses, penalties: ds.adjustments.penalties
        });
        CTX.dataset = ds;
        CTX.doctorStats = AUH.domain.doctorStats.computeDoctorStats({
          residents: ds.residents, oncall: ds.oncall, evaluation: ds.evaluation,
          bonuses: resolved.bonuses, penalties: resolved.penalties,
          annualHolidays: new Set([...(ds.rules.annualHolidays || []), ...ds.holidays.dates]),
          today: new Date().toISOString().slice(0, 10), currentMonth: new Date().getMonth() + 1
        });
        CTX.ready = true;
      })
      .catch(() => { CTX.ready = false; }); // لا عطل على القائمة الأساسية — فقط بلا إحصائيات
  }

  function statsLine(abbr, name) {
    if (!CTX.ready) return '';
    const s = AUH.domain.doctorStats.findStatsFor(CTX.doctorStats, name, abbr);
    if (!s) return '';
    return `${escapeHtml(name)}: <b>${s.total}</b> مناوبة إجمالاً (<b>${s.completed}</b> منفَّذة)`;
  }

  /** مَن في خانة (تاريخ×فئة) الآن — بأسماء اللائحة لمعرفة الجنس. */
  function occupantsOn(date, cat) {
    if (!CTX.ready) return null;
    const oncall = CTX.dataset.oncall;
    const colIdx = (oncall.headers || []).findIndex(h => normAr(h || '') === normAr(cat));
    if (colIdx < 0) return null;
    const dayRow = (oncall.rows || []).find(r => r.date === date);
    if (!dayRow) return null;
    const cell = (dayRow.row[colIdx] || '').trim();
    if (!cell) return [];
    return splitNames(cell).map(raw => CTX.dataset.residents.findByNameOrAbbr(raw)).filter(Boolean);
  }

  function countGender(list) {
    return {
      m: list.filter(r => normAr(r.gender) === normAr('طبيب')).length,
      f: list.filter(r => normAr(r.gender) === normAr('طبيبة')).length
    };
  }

  /** معاينةُ أثر النقلة على توازن ذكور وإناث في خانة واحدة — null إن لا قاعدة لهذه الفئة. */
  function genderPreview(date, cat, fromAbbr, toAbbr) {
    const rule = ruleFor(cat);
    if (!rule || !CTX.ready) return null;
    const occ = occupantsOn(date, cat);
    if (!occ) return { error: true, cat, date };

    const before = countGender(occ);
    const after = occ.filter(r => normAr(r.abbr || r.name) !== normAr(fromAbbr));
    const toResident = CTX.dataset.residents.findByNameOrAbbr(toAbbr);
    if (toResident && !after.some(r => normAr(r.abbr || r.name) === normAr(toResident.abbr || toResident.name))) {
      after.push(toResident);
    }
    const afterCount = countGender(after);
    const violatesAfter = afterCount.m < rule.minM || (rule.minF > 0 && afterCount.f < rule.minF);
    return { cat, date, rule, before, after: afterCount, violatesAfter };
  }

  function genderBoxHtml(g) {
    if (!g) return '';
    if (g.error) return `<div class="gender-box"><span class="g-head">⚠ توازن ذكور وإناث (${escapeHtml(g.cat)})</span><div class="g-row">تعذّر إيجاد هذا اليوم/الفئة في الجدول الحالي.</div></div>`;
    const need = g.rule.minF > 0 ? `حدٌّ أدنى: ${g.rule.minM} ذكور و${g.rule.minF} إناث` : `حدٌّ أدنى: ${g.rule.minM} ذكور`;
    return `<div class="gender-box ${g.violatesAfter ? 'warn' : 'ok'}">
      <span class="g-head">${g.violatesAfter ? '⚠' : '✓'} توازن ذكور وإناث — ${escapeHtml(g.cat)} (${fmtDayDate(g.date)})</span>
      <div class="g-row"><span>الآن: ${g.before.m} ذكور، ${g.before.f} إناث</span>
      <span>بعد الاعتماد: <b>${g.after.m} ذكور، ${g.after.f} إناث</b></span><span>${need}</span></div>
    </div>`;
  }

  const STATUS_LABEL = {
    pending_confirm: 'بانتظار تأكيد الطرف الآخر',
    pending_admin: 'بانتظار اعتماد الأدمن',
    approved: 'اعتُمِد', rejected_by_target: 'رفضه الطرف الآخر', rejected_by_admin: 'رفضه الأدمن',
    cancelled_by_requester: 'ألغاه مقدّم الطلب'
  };
  const STATUS_CLASS = {
    pending_confirm: 'status', pending_admin: 'status',
    approved: 'approved', rejected_by_target: 'rejected', rejected_by_admin: 'rejected',
    cancelled_by_requester: 'rejected'
  };

  /** اسمٌ قابلٌ للضغط — يفتح نافذة رزنامة هذا الطبيب (انظر openDoctorModal). */
  function nameLink(name, abbr) {
    return `<span class="doc-name-link" data-name="${escapeHtml(name)}" data-abbr="${escapeHtml(abbr)}">${escapeHtml(name)} (${escapeHtml(abbr)})</span>`;
  }

  /** "2026-11-14" ← "14-11-2026 السبت" — التاريخ مع اسم اليوم، بنظرةٍ واحدة. */
  function fmtDayDate(iso) {
    return escapeHtml(AUH.dates.formatDisplayDateWithDay(iso));
  }

  const KIND_CLASS = { 'شيل': 'kind-shel', 'تبديل': 'kind-swap' };
  function kindBadge(kind) {
    return `<span class="kind-badge ${KIND_CLASS[kind] || ''}">${escapeHtml(kind)}</span>`;
  }

  /**
   * نتيجة تنفيذ الاعتماد على الجدول الحقيقي — «نظام-التبديل.gs» يتحقّق فعلياً
   * بعد الكتابة (لا يفترض النجاح لمجرّد عدم رمي استثناء)، فيبدأ بـ«فشل:» حين
   * لا تُطابق الخليّة المتوقَّع. حين يفشل نعرضه تنبيهاً أحمر بارزاً أعلى
   * البطاقة مباشرةً — لا سطراً هادئاً بين الملاحظات قد يفوت الأدمن فيظنّ أنّ
   * المناوبة تبدَّلت فعلاً وهي لم تتبدَّل بعد.
   */
  function scheduleResultHtml(r) {
    if (!r.scheduleResult) return '';
    if (r.scheduleResult.indexOf('فشل') === 0) {
      return `<div class="sched-alert"><i class="fas fa-triangle-exclamation"></i>
        <div><b>تنبيه: هذه المناوبة لم تتبدَّل على الجدول بعد</b><span>${escapeHtml(r.scheduleResult)}</span>
        <button type="button" class="retry-btn" data-id="${escapeHtml(r.id)}"><i class="fas fa-rotate-right"></i> إعادة المحاولة</button></div>
      </div>`;
    }
    return `<div class="notes sched-ok"><i class="fas fa-circle-check"></i> ${escapeHtml(r.scheduleResult)}</div>`;
  }

  const FAILED = r => r.scheduleResult && r.scheduleResult.indexOf('فشل') === 0;

  function render() {
    const host = el('list');
    let shown = requests.filter(r => {
      if (filter === 'pending') return r.status === 'pending_admin';
      if (filter === 'shel') return r.kind === 'شيل';
      if (filter === 'swap') return r.kind === 'تبديل';
      if (filter === 'failed') return FAILED(r);
      return true; // 'all'
    });
    shown = shown.slice().sort((a, b) => {
      const ka = a.createdAt || '', kb = b.createdAt || '';
      return sortDesc ? kb.localeCompare(ka) : ka.localeCompare(kb);
    });
    if (!shown.length) { host.innerHTML = '<p class="empty">لا طلبات هنا.</p>'; return; }

    host.innerHTML = shown.map(r => {
      const label = STATUS_LABEL[r.status] || r.status;
      const cls = STATUS_CLASS[r.status] || 'status';
      const canDecide = r.status === 'pending_admin';
      return `<div class="req" data-id="${escapeHtml(r.id)}">
        <div class="top">
          <div><div class="who">${kindBadge(r.kind)} ${nameLink(r.fromName, r.fromAbbr)} ← ${nameLink(r.toName, r.toAbbr)}</div>
          <div class="shift-meta">
            <span class="shift-chip"><i class="fas fa-stethoscope"></i> ${escapeHtml(r.shiftType)}</span>
            <span class="shift-chip date"><i class="fas fa-calendar-day"></i> ${fmtDayDate(r.shiftDate)}</span>
            ${r.kind === 'تبديل' && r.backDate ? `<span class="shift-chip back"><i class="fas fa-right-left"></i> مقابل: ${escapeHtml(r.backType)} — ${fmtDayDate(r.backDate)}</span>` : ''}
          </div></div>
          <div>${r.urgent ? '<span class="badge urgent"><i class="fas fa-triangle-exclamation"></i> عاجل</span> ' : ''}<span class="badge ${cls}">${escapeHtml(label)}</span></div>
        </div>
        ${scheduleResultHtml(r)}
        ${r.reason ? `<div class="notes"><b>السبب:</b> ${escapeHtml(r.reason)}</div>` : ''}
        ${r.notes ? `<div class="notes">${escapeHtml(r.notes)}</div>` : ''}
        ${r.phone ? `<div class="meta" style="margin-top:6px">هاتف مُقدّم الطلب: ${escapeHtml(r.phone)}</div>` : ''}
        ${canDecide && CTX.ready ? `<div class="stat-row">
            <span>${statsLine(r.fromAbbr, r.fromName)}</span><span>${statsLine(r.toAbbr, r.toName)}</span>
          </div>
          ${genderBoxHtml(genderPreview(r.shiftDate, r.shiftType, r.fromAbbr, r.toAbbr))}
          ${r.kind === 'تبديل' && r.backDate ? genderBoxHtml(genderPreview(r.backDate, r.backType, r.toAbbr, r.fromAbbr)) : ''}` : ''}
        ${canDecide ? `<div class="actions">
            <input type="text" placeholder="ملاحظة (اختياري)" class="note-input">
            <button type="button" class="ok" data-decision="approve">قبول</button>
            <button type="button" class="no" data-decision="reject">رفض</button>
          </div>` : ''}
      </div>`;
    }).join('');

    host.querySelectorAll('.req').forEach(card => {
      const id = card.dataset.id;
      card.querySelectorAll('.actions button').forEach(btn => {
        const originalLabel = btn.textContent;
        btn.addEventListener('click', () => {
          card.querySelectorAll('.actions button').forEach(b => { b.disabled = true; });
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ التنفيذ...';
          const note = card.querySelector('.note-input').value.trim();
          AUH.data.swapRequests.adminDecideRequest(passcode, id, btn.dataset.decision, note)
            .then(res => { if (!res || res.state !== 'ok') alert((res && res.message) || 'تعذّر تنفيذ القرار.'); load(); })
            .catch(err => { alert(err.message || 'تعذّر تنفيذ القرار.'); load(); })
            .finally(() => { btn.textContent = originalLabel; });
        });
      });
    });

    host.querySelectorAll('.doc-name-link').forEach(s => {
      s.addEventListener('click', () => openDoctorModal(s.dataset.name, s.dataset.abbr));
    });

    host.querySelectorAll('.retry-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ إعادة المحاولة...';
        AUH.data.swapRequests.retryScheduleExecution(passcode, btn.dataset.id)
          .then(res => { if (!res || res.state !== 'ok') alert((res && res.message) || 'تعذّرت إعادة المحاولة.'); load(); })
          .catch(err => { alert(err.message || 'تعذّرت إعادة المحاولة.'); load(); });
      });
    });
  }

  /* ------------------------------------------------- نافذة رزنامة الطبيب */

  /** رقم محليّ سوري يبدأ بصفر — واتساب يحتاج رمز الدولة ٩٦٣ بدلاً من الصفر. */
  const phoneRowHtml = phone => `<div class="mp-row"><span class="mp-num">${escapeHtml(phone)}</span>` +
    `<span class="mp-pbtns">` +
    `<a href="tel:${escapeHtml(phone)}" class="mp-pbtn" title="اتصال"><i class="fas fa-phone"></i></a>` +
    `<a href="${AUH.text.waLink(phone)}" target="_blank" rel="noopener" class="mp-pbtn wa" title="واتساب"><i class="fab fa-whatsapp"></i></a>` +
    `<button type="button" class="mp-pbtn copy" data-phone="${escapeHtml(phone)}" title="نسخ الرقم"><i class="fas fa-copy"></i></button>` +
    `</span></div>`;

  let docMonths = [];
  let docMonthIdx = 0;
  let docEntry = null;

  function findResident(name, abbr) {
    const residents = CTX.dataset && CTX.dataset.residents;
    if (!residents) return null;
    return residents.findByNameOrAbbr(abbr) || residents.findByNameOrAbbr(name) || null;
  }

  function openDoctorModal(name, abbr) {
    el('docModalName').textContent = `${name} (${abbr})`;

    const resident = findResident(name, abbr);
    const phones = [...new Set([
      ...AUH.text.splitPhones(resident && resident.phone),
      ...AUH.text.splitPhones(resident && resident.phone2)
    ])];
    el('docModalPhones').innerHTML = phones.length
      ? phones.map(phoneRowHtml).join('')
      : '<span class="modal-nophone"><i class="fas fa-phone-slash"></i> لا رقم في اللائحة</span>';
    el('docModalPhones').querySelectorAll('.mp-pbtn.copy').forEach(btn => btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.phone).then(() => {
        const icon = btn.querySelector('i');
        icon.className = 'fas fa-check';
        setTimeout(() => { icon.className = 'fas fa-copy'; }, 1200);
      }).catch(() => {});
    }));

    docEntry = CTX.ready ? AUH.domain.doctorStats.findStatsFor(CTX.doctorStats, name, abbr) : null;
    docMonths = docEntry ? [...new Set(docEntry.assignments.map(a => a.date.slice(0, 7)))].sort() : [];
    const thisMonth = new Date().toISOString().slice(0, 7);
    const idx = docMonths.indexOf(thisMonth);
    docMonthIdx = idx >= 0 ? idx : Math.max(docMonths.length - 1, 0);

    renderDocCalendar();
    el('docModal').hidden = false;
  }

  function renderDocCalendar() {
    el('docCalPrev').disabled = docMonthIdx <= 0;
    el('docCalNext').disabled = docMonthIdx >= docMonths.length - 1;

    const month = docMonths[docMonthIdx];
    if (!month || !docEntry) {
      el('docCalTitle').textContent = '—';
      el('docCalGrid').innerHTML = '<div class="empty-cal"><i class="fas fa-calendar-xmark"></i> لا توجد بيانات مناوباتٍ لهذا الطبيب.</div>';
      return;
    }

    const [y, m] = month.split('-').map(Number);
    el('docCalTitle').textContent = `${AUH.constants.MONTH_NAMES[m - 1]} ${y}`;

    const byDate = {};
    docEntry.assignments.forEach(a => { if (a.date.startsWith(month)) (byDate[a.date] = byDate[a.date] || []).push(a); });

    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const cells = [];
    for (let i = 0; i < 7; i++) cells.push(`<div class="dow">${AUH.constants.DAY_NAMES[i]}</div>`);
    for (let i = 0; i < first; i++) cells.push('<div class="day pad"></div>');
    for (let d = 1; d <= days; d++) {
      const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const mine = byDate[iso] || [];
      const cls = ['day'];
      if (mine.length) cls.push('duty');
      if (mine.some(x => x.isHoliday)) cls.push('hol');
      const tags = mine.map(x => `<span class="tag">${escapeHtml(x.category)}</span>`).join('');
      cells.push(`<div class="${cls.join(' ')}"><span class="dn">${d}</span>${tags}</div>`);
    }
    el('docCalGrid').innerHTML = cells.join('');
  }

  el('docCalPrev').addEventListener('click', () => { if (docMonthIdx > 0) { docMonthIdx--; renderDocCalendar(); } });
  el('docCalNext').addEventListener('click', () => { if (docMonthIdx < docMonths.length - 1) { docMonthIdx++; renderDocCalendar(); } });
  el('docModalClose').addEventListener('click', () => { el('docModal').hidden = true; });
  el('docModal').addEventListener('click', e => { if (e.target.id === 'docModal') el('docModal').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el('docModal').hidden) el('docModal').hidden = true; });

  /**
   * يُستدعى عند الضغط على «تحديث»، وتلقائياً كل ٣٠ ثانية بعد الدخول.
   * لا يمسح القائمة أثناء الجلب (فقط أيقونة الزرّ تدور) كي لا يفقد الأدمن
   * مكانه أو ملاحظةً بدأ كتابتها — التحديث التلقائي يتخطّى نفسه بالكامل إن
   * كان قرارٌ قيد التنفيذ الآن أو كانت إحدى حقول الملاحظة غير فارغة.
   */
  function load() {
    const btn = el('refreshBtn');
    if (btn) btn.classList.add('spin');
    AUH.data.swapRequests.adminListRequests(passcode).then(res => {
      if (!res || res.state !== 'ok') { el('list').innerHTML = `<p class="empty">${escapeHtml((res && res.message) || 'تعذّر التحميل.')}</p>`; return; }
      requests = res.requests || [];
      render();
      const ts = el('lastRefresh');
      if (ts) ts.textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }).catch(() => { el('list').innerHTML = '<p class="empty">تعذّر التحميل — أعد المحاولة.</p>'; })
      .finally(() => { if (btn) btn.classList.remove('spin'); });
  }

  function autoRefreshTick() {
    if (document.querySelector('.actions button:disabled')) return; // قرارٌ قيد التنفيذ الآن — لا تزاحمه
    if ([...document.querySelectorAll('.note-input')].some(i => i.value.trim())) return; // ملاحظةٌ قيد الكتابة
    load();
  }
  let autoRefreshTimer = null;
  function startAutoRefresh() {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(autoRefreshTick, 30000);
  }

  el('refreshBtn').addEventListener('click', load);

  el('sortBtn').addEventListener('click', () => {
    sortDesc = !sortDesc;
    el('sortBtn').innerHTML = sortDesc
      ? '<i class="fas fa-arrow-down-wide-short"></i> الأحدث أولاً'
      : '<i class="fas fa-arrow-up-wide-short"></i> الأقدم أولاً';
    render();
  });

  function exportLogExcel() {
    if (!requests.length) { alert('لا طلبات لتصديرها بعد.'); return; }
    const rows = requests.map(r => ({
      'النوع': r.kind,
      'من (اسم)': r.fromName, 'من (اختصار)': r.fromAbbr,
      'إلى (اسم)': r.toName, 'إلى (اختصار)': r.toAbbr,
      'تاريخ المناوبة': r.shiftDate, 'نوع المناوبة': r.shiftType,
      'تاريخ المقابل': r.backDate || '', 'نوع المقابل': r.backType || '',
      'عاجل': r.urgent ? 'نعم' : '',
      'الحالة': STATUS_LABEL[r.status] || r.status,
      'السبب': r.reason || '', 'ملاحظات مقدّم الطلب': r.notes || '', 'هاتف مقدّم الطلب': r.phone || '',
      'تاريخ التقديم': r.createdAt || '', 'تاريخ قرار الأدمن': r.decidedAt || '',
      'ملاحظة الأدمن': r.adminNote || '', 'نتيجة التنفيذ على الجدول': r.scheduleResult || ''
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'سجل التبديل والشيل');
    XLSX.writeFile(wb, `سجل_تبديل_المناوبات_${new Date().toISOString().slice(0, 10)}.xlsx`);
  }
  el('exportBtn').addEventListener('click', exportLogExcel);

  el('tabs').addEventListener('click', e => {
    const btn = e.target.closest('button[data-f]');
    if (!btn) return;
    filter = btn.dataset.f;
    el('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    render();
  });

  el('gateForm').addEventListener('submit', e => {
    e.preventDefault();
    const tryCode = el('gateInput').value.trim();
    if (!tryCode) return;
    el('gateBtn').disabled = true;
    AUH.data.swapRequests.adminListRequests(tryCode).then(res => {
      el('gateBtn').disabled = false;
      if (!res || res.state !== 'ok') { el('gateErr').textContent = (res && res.message) || 'تعذّر الدخول.'; return; }
      passcode = tryCode;
      requests = res.requests || [];
      el('gate').hidden = true;
      el('page').hidden = false;
      if (res.created) alert('تم إنشاء كلمة سرّ الأدمن الآن — احفظها، لا استرجاع لها إن نُسيت (راجع تعليق CONFIG في نظام-التبديل.gs للاسترجاع من المحرّر).');
      render();
      el('lastRefresh').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      loadScheduleContext().then(render); // الإحصائيات تصل لاحقاً ولا تؤخّر ظهور القائمة
      startAutoRefresh();
    }).catch(err => { el('gateBtn').disabled = false; el('gateErr').textContent = err.message || 'تعذّر الدخول.'; });
  });
  }); // DOMContentLoaded
})();
</script>
</body>
</html>
