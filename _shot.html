<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#f7f5f0;overflow:hidden}
iframe{width:1080px;height:2600px;border:0;display:block;transform-origin:top right}</style></head>
<body><iframe id="f" src="swap.html?from=%D9%8A%D9%88%D8%B2%D8%BA%D8%A7%D8%AF%D9%84%D9%8A"></iframe>
<script>
const P = new URLSearchParams(location.search);
const step = P.get('step') || '1';
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  for (let i=0;i<80 && d.getElementById('form').hidden;i++) await wait(400);
  await wait(700);
  const $ = id => d.getElementById(id);
  const q = s => d.querySelector(s);
  const pick = () => d.querySelectorAll('#cal1 .day.pick')[0].click();

  if (step >= 2) { pick(); await wait(500); }
  if (step >= 3) { q('[data-kind="تبديل"]').click(); await wait(900); }
  if (step >= 4) { $('stripOk').click(); await wait(900); }
  if (step >= 5) { $('stripOk').click(); await wait(500); q('.cand').click(); await wait(900); }
  if (step >= 6) { const g = q('.ba-side .day.swappable') || q('#cal2 .day.swappable'); if (g) g.click(); await wait(700); }
  if (step == 7) { q('[data-kind="شيل"]').click(); await wait(800); q('.cand').click(); await wait(900); }

  // frame the section this step is about
  const anchors = {1:'#s2',2:'#s3',3:'#s4',4:'#s4',5:'#s5',6:'#s6',7:'#s5'};
  const el = d.querySelector(anchors[step] || '#s2');
  if (el) w.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + w.scrollY - 20));
  await wait(500);
  document.title = 'READY';
};
</script></body></html>
